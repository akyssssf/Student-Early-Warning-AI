name: Quality Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  web:
    name: Frontend (Next.js, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (Flask, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest
        env:
          APP_ENV: testing
      - name: Cek migrasi Alembic sinkron dengan model
        run: |
          flask --app run.py db upgrade
          flask --app run.py db check
        env:
          APP_ENV: development
          DATABASE_URL: sqlite:///ci.db

  vite:
    name: Modul 8 (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modul-8-vite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modul-8-vite/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run build
