name: Quality Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  web:
    name: Aplikasi utama (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  vite:
    name: Modul 8 (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modul-8-vite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modul-8-vite/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run build
