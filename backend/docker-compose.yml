# Sesuai Bagian 10 dokumen arsitektur (versi awal: api + db; nginx & worker menyusul)
# Jalankan:  cp .env.example .env   (isi JWT_SECRET_KEY dan MYSQL_ROOT_PASSWORD, set APP_ENV=production)
#            docker compose up --build
#            docker compose exec api python seed.py     (akun demo, sekali saja)
services:
  api:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:?isi MYSQL_ROOT_PASSWORD di .env}@db:3306/student_early_warning
    ports: ["127.0.0.1:5000:5000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?isi MYSQL_ROOT_PASSWORD di .env}
      MYSQL_DATABASE: student_early_warning
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  dbdata:
